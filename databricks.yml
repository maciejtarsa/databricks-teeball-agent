bundle:
  name: teeball

include:
  - resources/*.yml

sync:
  exclude:
    - knowledge/text/**
    - CLAUDE.md

variables:
  catalog:
    description: UC catalog for teeball assets
    default: workspace
  schema:
    description: UC schema for teeball assets
    default: teeball
  volume_dir:
    description: Volume folder holding the rulebook PDFs
    default: /Volumes/${var.catalog}/${resources.schemas.teeball.name}/${resources.volumes.kb_docs.name}/rulebooks
  llm_endpoint:
    description: Foundation model endpoint that writes the answers
    default: databricks-gpt-oss-120b
  embedding_endpoint:
    description: Foundation model endpoint for chunk + question embeddings
    default: databricks-gte-large-en
  warehouse_id:
    description: SQL warehouse for Genie + SQL tasks
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-414b7f92-c469.cloud.databricks.com
      profile: teeball

  prod:
    mode: production
    workspace:
      host: https://dbc-414b7f92-c469.cloud.databricks.com
      profile: teeball
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
