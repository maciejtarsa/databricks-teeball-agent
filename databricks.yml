bundle:
  name: teeball

include:
  - resources/*.yml

sync:
  exclude:
    - knowledge/text/**
    - CLAUDE.md

variables:
  catalog:
    description: UC catalog for teeball assets
    default: workspace
  schema:
    description: UC schema for teeball assets
    default: teeball
  volume_dir:
    description: Volume folder holding the rulebook PDFs
    default: /Volumes/${var.catalog}/${resources.schemas.teeball.name}/${resources.volumes.kb_docs.name}/rulebooks
  llm_endpoint:
    description: Foundation model endpoint that writes the answers
    default: databricks-gpt-oss-120b
  embedding_endpoint:
    description: Foundation model endpoint for chunk + question embeddings
    default: databricks-gte-large-en
  answer_prompt:
    description: Answer prompt file in src/prompts used by ask_rulebook (v3 = Manual-aware, procedure steps, WTBA by-laws)
    default: answer_rules_v3.md
  retrieval_mode:
    description: "ask_rulebook retrieval: vector | hybrid | hybrid_siblings (see src/jobs/rag_sql.py)"
    default: hybrid
  business_group:
    description: Workspace group that can ask the prod agent (CAN_RUN), call ask_rulebook and read the documents table
    default: business_us
  warehouse_id:
    description: SQL warehouse for Genie + SQL tasks
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: teeball  # ~/.databrickscfg profile holding your workspace host

  prod:
    mode: production
    workspace:
      profile: teeball  # ~/.databrickscfg profile holding your workspace host
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      # Prod is what business users (var.business_group) can ask; dev stays owner-only
      genie_spaces:
        teeball_agent:
          permissions:
            - group_name: ${var.business_group}
              level: CAN_RUN
      schemas:
        teeball:
          grants:
            # No SELECT: ask_rulebook reads rule_chunks with its owner's rights; the ingest job grants SELECT on documents only
            - principal: ${var.business_group}
              privileges: [USE_SCHEMA, EXECUTE]
