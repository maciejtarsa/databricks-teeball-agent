resources:
  jobs:
    eval_rulings:
      name: teeball_eval_rulings
      description: Score ask_rulebook against the logged rulings (evals/rulings.json) with an LLM judge
      tasks:
        - task_key: eval
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/eval_rulings.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.teeball.name}
              - ${var.llm_endpoint}
              - ${workspace.file_path}/evals/rulings.json
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
