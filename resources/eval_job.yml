resources:
  jobs:
    eval_rulings:
      name: teeball_eval_rulings
      description: Score ask_rulebook variants (model x retrieval mode) against the logged rulings (evals/rulings.json) with an LLM judge
      parameters:
        - name: models
          default: ${var.llm_endpoint}
        - name: modes
          default: ${var.retrieval_mode}
        - name: judge
          default: databricks-llama-4-maverick
        - name: label
          default: adhoc
        - name: evals_file
          default: rulings.json
        - name: prompt
          default: ${var.answer_prompt}
        - name: id_prefix
          default: all
      tasks:
        - task_key: eval
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/eval_rulings.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.teeball.name}
              - ${var.embedding_endpoint}
              - ${workspace.file_path}/src/prompts/{{job.parameters.prompt}}
              - ${workspace.file_path}/evals/{{job.parameters.evals_file}}
              - "{{job.parameters.judge}}"
              - "{{job.parameters.models}}"
              - "{{job.parameters.modes}}"
              - "{{job.parameters.label}}"
              - "{{job.parameters.id_prefix}}"
              - ${workspace.file_path}/src/jobs
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    eval_genie:
      name: teeball_eval_genie
      description: Ask the deployed Genie agent the logged rulings via the Genie Conversation API; record whether it called ask_rulebook and judge the answer users see
      parameters:
        - name: judge
          default: databricks-llama-4-maverick
        - name: label
          default: adhoc
        - name: evals_file
          default: rulings.json
        - name: id_prefix
          default: all
      tasks:
        - task_key: eval
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/eval_genie.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.teeball.name}
              - ${resources.genie_spaces.teeball_agent.id}
              - ${workspace.file_path}/evals/{{job.parameters.evals_file}}
              - "{{job.parameters.judge}}"
              - "{{job.parameters.label}}"
              - "{{job.parameters.id_prefix}}"
              - ${workspace.file_path}/src/jobs
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    generate_evalset:
      name: teeball_generate_evalset
      description: Teacher LLM (full Rule Book in context) writes question/expected-answer pairs per rule topic
      parameters:
        - name: limit
          default: "10"
        - name: per_topic
          default: "2"
        - name: teacher
          default: ${var.llm_endpoint}
        - name: checker
          default: databricks-llama-4-maverick
      tasks:
        - task_key: generate
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/generate_evalset.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.teeball.name}
              - "{{job.parameters.teacher}}"
              - ${workspace.file_path}/src/prompts/generate_questions.md
              - "{{job.parameters.per_topic}}"
              - "{{job.parameters.limit}}"
              - /Volumes/${var.catalog}/${resources.schemas.teeball.name}/${resources.volumes.kb_docs.name}/evals/generated.json
              - "{{job.parameters.checker}}"
              - ${var.embedding_endpoint}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    eval_retrieval:
      name: teeball_eval_retrieval
      description: Retrieval-only eval (no LLM answers) - does the selected context contain each question's rule/section?
      parameters:
        - name: modes
          default: vector|hybrid|hybrid_siblings
        - name: label
          default: adhoc
        - name: evals_file
          default: opus.json
      tasks:
        - task_key: eval
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/eval_retrieval.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.teeball.name}
              - ${var.embedding_endpoint}
              - ${workspace.file_path}/evals/{{job.parameters.evals_file}}
              - "{{job.parameters.modes}}"
              - "{{job.parameters.label}}"
              - ${workspace.file_path}/src/jobs
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
